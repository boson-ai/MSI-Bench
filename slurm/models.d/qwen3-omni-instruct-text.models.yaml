# prompt_json protocol; only the input modality changes.
base:
  - name: qwen3-omni-30b-text
    provider: local_text
    model: Qwen3-Omni-30B-A3B-Instruct
    checkpoint_path: /ceph/models/Qwen3-Omni-30B-A3B-Instruct
