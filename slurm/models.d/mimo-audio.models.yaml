# ib eval targets served by the mimo-audio Slurm job.
# MiMo's omni serving stack 400s when the same audio is sent twice to one
# server instance (mm cache bug), so the thinking and plain variants run as
# separate jobs (see mimo-audio-plain) instead of sharing one server.
base:
  - name: mimo-audio-7b-thinking
    provider: local
    model: MiMo-Audio-7B-Instruct
    checkpoint_path: /ceph/models/MiMo-Audio-7B-Instruct
    thinking_mode: enabled
