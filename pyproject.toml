[project]
name = "msi-bench-eval"
version = "0.1.0"
description = "MSI-Bench evaluation harness: audio multi-speaker interaction benchmark scoring and judging."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "openai>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]

[project.scripts]
ib = "ib.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ib"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "google-genai>=1.0.0",  # the gemini tests import it; runtime users opt in via the extra
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
